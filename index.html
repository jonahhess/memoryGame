<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon Memory Game</title>
    <style>
      header {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
      }

      header * {
        margin: 0;
        padding: 0.5rem;
      }

      h1 {
        text-align: center;
      }

      #reset {
        border-radius: 16px;
        border: 1px solid grey;
      }

      #reset,
      .card {
        transition:
          transform 120ms ease,
          box-shadow 120ms ease,
          background-color 120ms ease;
      }

      #reset:hover,
      .card:hover {
        background-color: #f3f3f3;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      }

      #reset:active,
      .card:active {
        transform: translateY(1px) scale(0.98);
      }

      #reset:focus-visible,
      .card:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }

      #win-text {
        visibility: hidden;
      }

      #board {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        position: relative;
        width: min(92vw, 520px, calc((100dvh - 170px) * 2 / 3));
        aspect-ratio: 2 / 3;
        margin: 16px auto;
      }

      #board.blocked {
        pointer-events: none;
      }

      .card,
      .selected,
      .finished {
        border: 1px solid black;
        font-size: clamp(22px, 6vmin, 64px);
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        user-select: none;
        overflow: hidden;
      }

      .card {
        cursor: pointer;
      }

      .card img,
      .selected img,
      .finished img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        pointer-events: none;
      }

      .finished {
        background-color: lightgreen;
      }
      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgb(255, 255, 255);
      }
    </style>
  </head>
  <body>
    <header>
      <h2 id="tries">Tries: 0</h2>
      <h2 id="successes">Pairs found: 0</h2>
      <button id="reset">Reset</button>
      <p id="high-score">High Score: 0%</p>
      <p id="win-text">You Win!</p>
    </header>
    <h1>Pokemon Memory Game</h1>
    <div id="board"></div>
  </body>
  <script>
    (() => {
      class MemoryGame {
        #constants;
        #dom;
        #state;

        constructor() {
          this.#constants = {
            pairs: 12,
            maxPokemonId: 1025,
            baseUrl:
              "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/",
          };

          this.#dom = {
            board: document.getElementById("board"),
            attempts: document.getElementById("tries"),
            found: document.getElementById("successes"),
            score: document.getElementById("high-score"),
            reset: document.getElementById("reset"),
            winText: document.getElementById("win-text"),
          };

          this.#state = {
            pokemonIds: this.#generatePokemonIds(),
            selectedCards: [],
            tries: 0,
            successes: 0,
            highScore: 0,
          };

          this.#dom.reset.onclick = () => this.#initState();
          this.#initState();
        }

        #generatePokemonIds() {
          const idSet = new Set();
          while (idSet.size < this.#constants.pairs) {
            idSet.add(
              Math.floor(Math.random() * this.#constants.maxPokemonId) + 1,
            );
          }
          return Array.from(idSet);
        }

        #shuffleCards(array) {
          return array
            .map((item) => ({
              item,
              key: crypto.getRandomValues(new Uint32Array(1))[0],
            }))
            .sort((a, b) => a.key - b.key)
            .map(({ item }) => item);
        }

        #createCard(pokemonId) {
          const card = document.createElement("button");
          card.classList.add("card");

          const img = document.createElement("img");
          img.src = `${this.#constants.baseUrl}${pokemonId}.png`;
          card.appendChild(img);

          return card;
        }

        #renderScore() {
          this.#dom.attempts.innerHTML = `Tries: ${this.#state.tries}`;
          this.#dom.found.innerHTML = `Pairs found: ${this.#state.successes}`;

          if (this.#state.successes >= this.#constants.pairs) {
            this.#dom.winText.style.visibility = "visible";

            const potentialHighScore =
              (this.#state.successes / this.#state.tries) * 100;

            if (
              Number.isFinite(potentialHighScore) &&
              potentialHighScore > this.#state.highScore
            ) {
              this.#state.highScore = potentialHighScore;
              this.#dom.score.innerHTML = `High Score: ${+this.#state.highScore.toFixed(2)} %`;
            }
          } else {
            this.#dom.winText.style.visibility = "hidden";
          }
        }

        #handleSelect(card) {
          if (this.#state.selectedCards.length >= 2) {
            this.#initState();
            return;
          }

          card.classList.add("selected");
          card.classList.remove("card");
          this.#state.selectedCards.push(card);
        }

        #handleUnselect(card) {
          card.classList.add("card");
          card.classList.remove("selected");
        }

        #handleFind(card) {
          card.onclick = null;
          card.classList.add("finished");
          card.classList.remove("selected");
        }

        #handleFoundPair(card1, card2) {
          this.#state.successes += 1;
          this.#handleFind(card1);
          this.#handleFind(card2);
        }

        #handlePairNotFound(card1, card2) {
          this.#dom.board.classList.add("blocked");
          setTimeout(() => {
            this.#handleUnselect(card1);
            this.#handleUnselect(card2);
            this.#dom.board.classList.remove("blocked");
          }, 1000);
        }

        #onCardClick(card) {
          if (
            card.classList.contains("selected") ||
            this.#dom.board.classList.contains("blocked")
          ) {
            return;
          }

          this.#handleSelect(card);
          if (this.#state.selectedCards.length < 2) {
            return;
          }

          this.#state.tries += 1;
          const [card1, card2] = this.#state.selectedCards;

          if (card1.innerHTML === card2.innerHTML) {
            this.#handleFoundPair(card1, card2);
          } else {
            this.#handlePairNotFound(card1, card2);
          }

          this.#state.selectedCards = [];
          this.#renderScore();
        }

        #initState() {
          this.#dom.board.innerHTML = "";
          this.#state.selectedCards = [];
          this.#state.tries = 0;
          this.#state.successes = 0;
          this.#state.highScore = 0;

          this.#renderScore();

          const cards = [];
          for (let i = 0; i < this.#constants.pairs; i++) {
            const pokemonId = this.#state.pokemonIds[i];
            cards.push(this.#createCard(pokemonId));
            cards.push(this.#createCard(pokemonId));
          }

          const mixedCards = this.#shuffleCards(cards);
          for (const card of mixedCards) {
            card.onclick = () => this.#onCardClick(card);
            this.#dom.board.appendChild(card);
          }
        }
      }

      new MemoryGame();
    })();
  </script>
</html>
