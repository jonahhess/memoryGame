<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Game</title>
    <style>
      header {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
      }

      header * {
        margin: 0;
        padding: 0.5rem;
      }

      h1 {
        text-align: center;
      }

      #reset {
        border-radius: 16px;
        border: 1px solid grey;
      }

      #win-text {
        visibility: hidden;
      }

      #board {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(6, 1fr);
        gap: 10px;
        position: relative;
        z-index: 2;
        width: min(95vw, calc((100dvh - 180px) * 2 / 3));
        max-height: calc(100dvh - 180px);
        aspect-ratio: 2 / 3;
        margin: 25px auto;
      }

      #board.blocked {
        pointer-events: none;
      }

      .card,
      .selected,
      .finished {
        border: 1px solid black;
        font-size: clamp(22px, 6vmin, 64px);
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }

      .finished {
        background-color: lightgreen;
      }
      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgb(255, 255, 255);
      }
    </style>
  </head>
  <body>
    <header>
      <h2 id="tries">Tries: 0</h2>
      <h2 id="successes">Pairs found: 0</h2>
      <button id="reset">Reset</button>
      <p id="high-score">High Score: 0%</p>
      <p id="win-text">You Win!</p>
    </header>
    <h1>Memory Game</h1>
    <div id="board"></div>
  </body>
  <script>
    // constants
    const PAIRS = 12;
    const MAX_POKEMON_ID = 1025;
    const BASE_URL =
      "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/";

    const ID_SET = new Set();
    while (ID_SET.size < PAIRS) {
      ID_SET.add(Math.floor(Math.random() * MAX_POKEMON_ID) + 1);
    }

    const POKEMON_IDS = Array.from(ID_SET);

    // html elements
    const board = document.getElementById("board");
    const attempts = document.getElementById("tries");
    const found = document.getElementById("successes");
    const score = document.getElementById("high-score");
    const reset = document.getElementById("reset");
    const winText = document.getElementById("win-text");

    // variables
    let numSelected = 0;
    let tries = 0;
    let successes = 0;
    let highScore = 0;

    // helper to shuffle cards
    function shuffleCards(array) {
      return array
        .map((item) => ({
          item,
          key: crypto.getRandomValues(new Uint32Array(1))[0],
        }))
        .sort((a, b) => a.key - b.key)
        .map(({ item }) => item);
    }

    function createCard(pokemon_id, emoji) {
      const card = document.createElement("button");
      card.classList.add("card");
      if (pokemon_id) {
        const img = document.createElement("img");
        img.src = `${BASE_URL}/${pokemon_id}.png`;
        card.appendChild(img);
      } else {
        card.innerText = emoji;
      }

      return card;
    }

    function renderScore() {
      attempts.innerHTML = `Tries: ${tries}`;
      found.innerHTML = `Pairs found: ${successes}`;
      if (successes >= PAIRS) {
        winText.style.visibility = "visible";
        const potentialHighScore = (successes / tries) * 100;
        highScore =
          Number.isFinite(potentialHighScore) && potentialHighScore > highScore
            ? potentialHighScore
            : 0;
        score.innerHTML = `High Score: ${+highScore.toFixed(2)} %`;
      } else {
        winText.style.visibility = "hidden";
      }
    }

    function handleSelect(selectedCards, card) {
      if (!Array.isArray(selectedCards) || selectedCards.length > 2) {
        initState();
        return;
      }
      card.classList.add("selected");
      card.classList.remove("card");
      selectedCards.push(card);
    }

    function handleUnselect(card) {
      card.classList.add("card");
      card.classList.remove("selected");
    }

    function handleFind(card) {
      card.onclick = "";
      card.classList.add("finished");
      card.classList.remove("selected");
    }

    function handleFoundPair(card1, card2) {
      successes += 1;
      handleFind(card1);
      handleFind(card2);
    }

    function handlePairNotFound(card1, card2) {
      board.classList.add("blocked");
      setTimeout(() => {
        handleUnselect(card1);
        handleUnselect(card2);
        board.classList.remove("blocked");
      }, 1000);
    }

    function initState() {
      board.innerHTML = "";
      selectedCards = [];
      tries = 0;
      successes = 0;
      highScore = 0;

      renderScore();

      const cards = [];
      for (let i = 0; i < PAIRS; i++) {
        const pokemon_id = POKEMON_IDS[i];
        cards.push(createCard(pokemon_id));
        cards.push(createCard(pokemon_id));
      }

      const mixedCards = shuffleCards(cards);

      for (const card of mixedCards) {
        card.onclick = () => {
          if (card.classList.contains("selected")) {
            return;
          }
          handleSelect(selectedCards, card);
          if (selectedCards.length < 2) return;
          tries += 1;

          const [card1, card2] = selectedCards;
          if (card1.innerHTML === card2.innerHTML) {
            handleFoundPair(card1, card2);
          } else {
            handlePairNotFound(card1, card2);
          }
          selectedCards = [];
          renderScore();
        };
        board.appendChild(card);
      }
    }

    initState();

    reset.onclick = initState;
  </script>
</html>
